<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | REGINALDSHERQSERVICES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; }
        .btn-custom { 
            background-color: #1a365d; 
            color: white; 
            font-weight: bold; 
            padding: 20px; 
            border-radius: 12px; 
            border: none;
            transition: 0.2s;
            display: block; width: 100%; margin-bottom: 10px;
        }
        .btn-custom:hover { background-color: #2d5a94; color: white; }
        .header-box { background-color: #1a365d; color: white; padding: 30px; border-bottom: 4px solid #99cc33; }
        .hidden-section { display: none; }
    </style>
</head>
<body>

    <div class="header-box text-center">
        <h4>REGINALD<span style="color: #99cc33;">SHERQ</span><span style="color: white;">SERVICES</span></h4>
        <small>INSPECTION</small>
    </div>

    <!-- STEP 1: Select Category -->
    <div class="container py-4" id="category-container">
        <div class="text-center mb-3">
            <a href="{{ url_for('admin_dashboard') }}" style="text-decoration: none; color: #1a365d; font-weight: bold;">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
        </div>
        
        <p class="text-center text-muted mb-4">Select equipment type:</p>
        
        <div class="d-grid gap-3">
            <button class="btn btn-custom" onclick="showChoice('Fire Extinguisher')">Fire Extinguisher</button>
            <button class="btn btn-custom" onclick="showChoice('Fire Hose Reel')">Fire Hose Reel</button>
            <button class="btn btn-custom" onclick="showChoice('Fire Hydrant')">Fire Hydrant</button>
        </div>
    </div>

    <!-- STEP 2: Choose Method (Scan vs Manual) -->
    <div class="container py-4 hidden-section" id="choice-container">
        <h4 class="text-center mb-3" id="selected-title">Equipment</h4>
        <p class="text-center text-muted mb-4">How would you like to proceed?</p>
        
        <div class="d-grid gap-3">
            <button class="btn btn-custom" onclick="startCameraScanner()">
                <i class="fas fa-camera"></i> Scan QR Code (Camera)
            </button>
            <button class="btn btn-secondary py-3 fw-bold" onclick="goToManualList()">
                <i class="fas fa-list"></i> Choose Manually from List
            </button>
            <button class="btn btn-outline-dark mt-2" onclick="location.reload()">
                &larr; Back
            </button>
        </div>
    </div>

    <!-- STEP 3: Active Camera Scanner -->
    <div class="container py-4 hidden-section" id="reader-container">
        <h5 class="text-center mb-3">Scanning QR Code...</h5>
        <div id="reader" style="width: 100%;"></div>
        <button class="btn btn-secondary mt-3 w-100" onclick="location.reload()">Cancel</button>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let selectedCategory = '';

        function showChoice(categoryName) {
            selectedCategory = categoryName;
            document.getElementById('selected-title').innerText = categoryName;
            document.getElementById('category-container').style.display = 'none';
            document.getElementById('choice-container').style.display = 'block';
        }

        function goToManualList() {
            let formattedCategory = selectedCategory.toLowerCase().replace(/\s+/g, '_');
            window.location.href = "/manual-select/" + formattedCategory;
        }

        let html5QrcodeScanner;

        function startCameraScanner() {
            document.getElementById('choice-container').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';

            function onScanSuccess(decodedText) {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.clear().catch(error => {
                        console.error("Failed to clear scanner. ", error);
                    });
                }

                let cleanText = decodedText.trim();
                if (cleanText.includes('/scan/')) {
                    let parts = cleanText.split('/scan/');
                    cleanText = parts[parts.length - 1];
                } else if (cleanText.startsWith('http')) {
                    window.location.href = cleanText;
                    return;
                }

                window.location.href = window.location.origin + "/scan/" + cleanText;
            }

            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 10, 
                    qrbox: {width: 250, height: 250},
                    videoConstraints: { facingMode: "environment" },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
                }
            );
            
            html5QrcodeScanner.render(onScanSuccess);
        }
    </script>
</body>
</html>
