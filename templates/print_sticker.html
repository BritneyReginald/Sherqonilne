<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label - {{ qr_code_id }}</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Helvetica', sans-serif; 
        }
        
        .sticker { 
            border: 2px solid #000; 
            padding: 20px; 
            width: 320px; 
            text-align: center; 
            background-color: #ffffff;
        }
        
        .logo { 
            font-weight: 800; 
            font-size: 16px; 
            margin-bottom: 5px; 
            color: #1a365d; 
        }
        
        .subtitle { 
            font-size: 9px; 
            margin-bottom: 15px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .qr-area { margin: 10px 0; }
        
        .scan-me { 
            font-weight: bold; 
            font-size: 20px; 
            margin-top: 10px; 
        }
        
        .asset-id { font-size: 14px; color: #555; margin-top: 5px; }

        @media print {
            .no-print { display: none; }
            body { height: auto; }
        }
    </style>
</head>
<body>

    <div class="sticker">
        <div class="logo">REGINALDSHERQSERVICES</div>
        <div class="subtitle">SAFETY • HEALTH • ENVIRONMENT • RISK • QUALITY</div>
        
        <div class="qr-area">
            <!-- Hardcoded ngrok URL so it instantly points to your live tunnel -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://scheme-absurd-seduce.ngrok-free.dev/scan/{{ qr_code_id }}" alt="QR Code" width="200" height="200">
        </div>
        
        <div class="scan-me">SCAN ME</div>
        <div class="asset-id">{{ qr_code_id }}</div>
    </div>

    <!-- Print Button (Hidden when printing) -->
    <div style="position: fixed; bottom: 20px;">
        <button class="no-print" onclick="window.print()" style="padding: 10px 20px; cursor: pointer;">Print This Label</button>
    </div>

</body>
</html>
