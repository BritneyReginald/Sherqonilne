name: Deploy Fire Equipment App to Azure

on:
  push:
    branches: [ sherq_online_fire ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Zip repository contents
      run: |
        zip -r release.zip . -x "*.git*" ".github/*"

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_FIRE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_FIRE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_FIRE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'ohs-online-fire'
        slot-name: 'Production'
        package: release.zip