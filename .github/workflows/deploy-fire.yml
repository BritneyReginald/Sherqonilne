name: Build and deploy Flask app to Azure Web App - ohs-online-fire

on:
  push:
    branches:
      - sherq_online_fire
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

     # - name: Upload Flask application
      #  uses: actions/upload-artifact@v4
       # with:
         # name: fire-app
         # path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
  #    - name: Download Flask application
   #     uses: actions/download-artifact@v4
       # with:
      #    name: fire-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_FIRE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_FIRE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_FIRE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ohs-online-fire'
          slot-name: 'Production'
          package: Sherqonline-backend