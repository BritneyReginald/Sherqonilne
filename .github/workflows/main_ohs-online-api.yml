# Deploys ONLY the Sherqonline-backend folder (compiled) to ohs-online-api
name: Build and deploy Node backend to Azure Web App - ohs-online-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install and build the backend
        working-directory: Sherqonline-backend
        run: |
          npm install
          npm run build

      - name: Remove dev-only packages to keep the deploy small
        working-directory: Sherqonline-backend
        run: npm prune --omit=dev

      - name: Upload ONLY the backend folder
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: Sherqonline-backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download the backend
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_569DA98B2AB544D7A1583C8E6C5FE36F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CFF8425451B24816A1EDEF004AE8B38E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6CF08C669C743148C8EA1A7A86343BE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ohs-online-api'
          slot-name: 'Production'
          package: .
